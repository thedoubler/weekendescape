<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="weekend.flights">
  <!-- The weekend column: a calendar tile with Fri/Sat/Sun lit in the brand
       orange — the product itself as the mark, and the same story the OG
       card tells. Dark ground so it holds on light AND dark tab bars; the
       muted cells are white at 22% so they read as "calendar" without
       competing with the lit column. Chosen over a plane (every third
       travel tab) and a "w." monogram (means nothing to a stranger) —
       owner picked A from the 2026-09-09 review. -->
  <rect width="32" height="32" rx="7" fill="#14161c"/>
  <g>
    <rect x="4.5"   y="4.5"   width="6.5" height="6.5" rx="1.8" fill="#ffffff" opacity=".22"/>
    <rect x="12.75" y="4.5"   width="6.5" height="6.5" rx="1.8" fill="#ffffff" opacity=".22"/>
    <rect x="21"    y="4.5"   width="6.5" height="6.5" rx="1.8" fill="#f97316"/>
    <rect x="4.5"   y="12.75" width="6.5" height="6.5" rx="1.8" fill="#ffffff" opacity=".22"/>
    <rect x="12.75" y="12.75" width="6.5" height="6.5" rx="1.8" fill="#ffffff" opacity=".22"/>
    <rect x="21"    y="12.75" width="6.5" height="6.5" rx="1.8" fill="#f97316"/>
    <rect x="4.5"   y="21"    width="6.5" height="6.5" rx="1.8" fill="#ffffff" opacity=".22"/>
    <rect x="12.75" y="21"    width="6.5" height="6.5" rx="1.8" fill="#ffffff" opacity=".22"/>
    <rect x="21"    y="21"    width="6.5" height="6.5" rx="1.8" fill="#f97316"/>
  </g>
</svg>
